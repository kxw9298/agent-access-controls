name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policies:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - name: Check policies
        run: opa check policies/
      - name: Run policy tests
        run: opa test policies/ -v

  catalog:
    name: Catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate control catalog
        run: python scripts/validate_catalog.py

  decision-log:
    name: Decision record schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema
      - name: Check schema, examples, and policy sync
        run: python scripts/validate_decision_log.py
      - name: Validate real policy output against the schema
        run: |
          mkdir -p "$RUNNER_TEMP/decisions"
          for input in examples/tool_authz/input-*.json; do
            opa eval -f json \
              -d policies/tool_authz/tool_authz.rego \
              -d examples/tool_authz/data.json \
              -i "$input" \
              "data.agentaccess.tool_authz.decision" \
              > "$RUNNER_TEMP/decisions/$(basename "$input")"
          done
          python scripts/validate_decision_log.py "$RUNNER_TEMP"/decisions/*.json

  approval-binding-demo:
    name: Approval-binding demonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Run the demonstration
        run: scripts/demo_approval_binding.sh
