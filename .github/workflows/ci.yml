name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policies:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - name: Check policies
        run: opa check policies/
      - name: Run policy tests
        run: opa test policies/ -v

  catalog:
    name: Catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate control catalog
        run: python scripts/validate_catalog.py

  decision-log:
    name: Decision record schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema
      - name: Check schema, examples, and policy sync
        run: python scripts/validate_decision_log.py
      - name: Validate real policy output against the schema
        run: |
          mkdir -p "$RUNNER_TEMP/decisions"
          for input in examples/tool_authz/input-*.json; do
            opa eval -f json \
              -d policies/tool_authz/tool_authz.rego \
              -d examples/tool_authz/data.json \
              -i "$input" \
              "data.agentaccess.tool_authz.decision" \
              > "$RUNNER_TEMP/decisions/$(basename "$input")"
          done
          python scripts/validate_decision_log.py "$RUNNER_TEMP"/decisions/*.json

  approval-binding-demo:
    name: Evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          command -v jq >/dev/null || brew install jq
          pip install jsonschema
      - name: Run the baseline and the demonstration
        run: scripts/run_evaluation.sh
      - name: Check that the results can be trusted
        run: python scripts/validate_results.py results/results.json
      - name: Check that the comparison table matches the results
        run: python scripts/render_comparison.py results/results.json --check docs/evaluation.md
      - name: Show the results
        if: always()
        run: cat results/results.json || true
      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-${{ matrix.os }}
          path: results/
          if-no-files-found: warn

  container-demo:
    name: Evaluation in a container, no network
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema
      - name: Run in the container with networking disabled
        run: scripts/run_in_container.sh
      - name: Check that the results can be trusted
        run: python scripts/validate_results.py results/results.json
      - name: Check that the comparison table matches the results
        run: python scripts/render_comparison.py results/results.json --check docs/evaluation.md
      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-container
          path: results/
          if-no-files-found: warn

  image-admission:
    name: Image admission (policy, then kind cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - name: Stage 1, decide which image digests may be approved
        run: scripts/demo_image_admission.sh "$RUNNER_TEMP/image-admission"
      - uses: helm/kind-action@v1
      - name: Show the cluster version
        run: kubectl version
      - name: Stage 2, check the cluster enforces the published digests
        run: scripts/demo_image_admission_cluster.sh "$RUNNER_TEMP/image-admission/approved-images.yaml"

  attack-harness:
    name: Attack harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the attack catalog, the fuzzer and the stored LLM attacker candidates
        run: python scripts/attack_harness.py --candidates evaluation/llm-attacks/types.jsonl evaluation/llm-attacks/logic.jsonl evaluation/llm-attacks/semantics.jsonl
      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-harness-results
          path: results/attack-harness/
          if-no-files-found: warn
