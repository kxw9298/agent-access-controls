name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policies:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - name: Check policies
        run: opa check policies/
      - name: Run policy tests
        run: opa test policies/ -v

  catalog:
    name: Catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate control catalog
        run: python scripts/validate_catalog.py
