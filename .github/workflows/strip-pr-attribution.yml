name: strip-pr-attribution

# Removes attribution footers that some tools append to pull request
# descriptions, together with the session link and the rule above them.
# Edits made with the workflow's own token do not trigger it again.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const footer = /^[ \t]*[_*]*(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)[_*]*[ \t]*$/;
            const session = /^[ \t]*https:\/\/claude\.ai\/code\/\S+[ \t]*$/;
            const lines = body.split('\n').filter(l => !footer.test(l) && !session.test(l));
            let cleaned = lines.join('\n').replace(/(\n[ \t]*-{3,}[ \t]*)+\s*$/, '').replace(/\s+$/, '');
            if (cleaned === body.replace(/\s+$/, '')) {
              core.info('No attribution footer found.');
              return;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: cleaned + '\n',
            });
            core.info('Removed attribution footer.');
